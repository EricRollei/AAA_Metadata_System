[project]
name = "aaa-metadata-system"
description = "Save images with generation metadata collected automatically and stored where Lightroom, XnView MP and Capture One can search it. PNG, JPG, WebP, TIFF, PSD and SVG, 16-bit, color management, Photoshop layers, quality measurements."
readme = "README.md"
version = "0.2.0"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
    { name = "Eric Hiss", email = "eric@rollei.us" }
]
maintainers = [
    { name = "Eric Hiss", email = "eric@rollei.us" }
]
keywords = ["comfyui", "metadata", "xmp", "lightroom", "save image", "psd", "tiff", "svg", "layers", "color profile", "civitai"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion"
]
dependencies = [
    "Pillow>=9.0.0",
    "opencv-python>=4.5.0",
    "numpy>=1.20.0",
    "psd-tools>=1.9.0",
    "tifffile>=2023.1.1",
    "pypng>=0.20220715.0",
    "colorthief>=0.2.1",
    "imagehash>=4.3.0",
    "tqdm>=4.65.0",
    "wordcloud>=1.9.0",
    "beautifulsoup4>=4.11.0",
    "markdown>=3.4.0",
    "requests>=2.28.0"
]

[project.urls]
Repository = "https://github.com/EricRollei/AAA_Metadata_System"
Documentation = "https://github.com/EricRollei/AAA_Metadata_System/wiki"
"Bug Tracker" = "https://github.com/EricRollei/AAA_Metadata_System/issues"
Homepage = "https://github.com/EricRollei/AAA_Metadata_System"

[tool.comfy]
PublisherId = "ericrollei"
DisplayName = "AAA Metadata System"
Icon = ""
requires-comfyui = ">=0.3.0"
